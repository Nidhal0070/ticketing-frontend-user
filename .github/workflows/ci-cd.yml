# 
#   CI/CD Pipeline — Frontend User React/Vite            
#   Déclenché à chaque push sur main                            
#   Build → Push Docker Hub                                      
# 

name: Frontend User CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/ticketing-frontend-user
  NODE_VERSION: '20'

jobs:
  # ─── Job 1 : Build Vite ───────────────────────────────────────
  build:
    name:  Build React/Vite
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout code
        uses: actions/checkout@v4

      - name:  Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name:  Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint --if-present

      - name:  Build Vite
        run: npm run build
        env:
          VITE_API_URL: /api

      - name:  Verify dist/
        run: ls -la dist/

  # ─── Job 2 : Build & Push Docker Hub ──────────────────────────
  docker:
    name: Build & Push Docker Hub
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name:  Checkout code
        uses: actions/checkout@v4

      - name:  Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name:  Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name:  Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name:  Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Image pushed successfully
        run: |
          echo "✅ Image pushed: ${{ env.DOCKER_IMAGE }}:latest"